<!-- WattPair appliance icon · RV rooftop air conditioner · 24-unit grid, sw 1.5 · design-system/ICONOGRAPHY.md
     Wide flat shroud on the roofline + a fan roundel carry the identity
     (rework note: see ICONOGRAPHY.md §6 — v1's parallel horizontal lines read
     as a document; v2's tall narrow dome read as a hat. A rooftop AC shroud
     is wide and low, not tall — proportion is what tells it apart from a hat
     — and the tri-blade roundel is the one mark this object owns that a
     generic box does not.) -->
