  <line x1="2" y1="19" x2="22" y2="19"/>
  <path d="M4 19 L4 15 Q4 12 8 12 L16 12 Q20 12 20 15 L20 19 Z"/>
  <circle cx="12" cy="15.8" r="2.3"/>
  <line x1="12" y1="15.8" x2="12" y2="14"/>
  <line x1="12" y1="15.8" x2="10.44" y2="16.7"/>
  <line x1="12" y1="15.8" x2="13.56" y2="16.7"/>
</svg>
