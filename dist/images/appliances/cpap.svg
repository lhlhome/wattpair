<!-- WattPair appliance icon · CPAP machine · 24-unit grid, sw 1.5 · design-system/ICONOGRAPHY.md
     A notched mask cushion (nose-bridge dip at the top edge, not a smooth
     round top) + hose + small unit carry the identity (rework note: see
     ICONOGRAPHY.md §6 — three earlier passes all kept a smooth oval/wedge
     outline, and "smooth closed shape + one line + small shape" reads as a
     magnifying glass or balloon-on-a-string regardless of the outline's exact
     form. The nose-bridge notch is the one contour a lens, a balloon and a
     pan never have — this is the icon most worth re-checking against real
     users; see ICONOGRAPHY.md §6 for the honest confidence level on this one.) -->
